<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Página não encontrada | GitHub Users</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Segoe UI', sans-serif;
        background: #0d1117;
        color: #e6edf3;
        text-align: center;
        padding: 2rem;
      }
      .code {
        margin: 0;
        font-size: 4rem;
        font-weight: 700;
        color: #2ea043;
      }
      h1 {
        margin: 0.5rem 0;
        font-size: 1.75rem;
      }
      p {
        color: #8b949e;
        max-width: 28rem;
      }
      a {
        display: inline-flex;
        margin-top: 1rem;
        padding: 0.75rem 1.2rem;
        border-radius: 12px;
        background: #238636;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Página não encontrada</h1>
      <p>Esse caminho não existe. Volte para a busca de usuários do GitHub.</p>
      <a href="/">Ir para a home</a>
    </main>
  </body>
</html>
